
name: Build Smart Calculator APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SmartCalculator.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Project
        run: unzip -q SmartCalculator.zip -d .

      - name: Build APK
        run: gradle -p SmartCalculator assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartCalculator-debug-apk
          path: SmartCalculator/app/build/outputs/apk/debug/*.apk
